name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_codegen:
        description: 'Force clean codegen from XEX even if cache exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-ios:
    name: Build NFS Carbon iOS (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow tomli

      - name: Cache Homebrew Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Cache ReXGlue iOS SDK & MoltenVK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: |
            ../rexglue-sdk-ios
            ~/.nfsc-ios
          key: ${{ runner.os }}-rexglue-sdk-v0.10.0-mvk-1.4.1

      - name: Setup AppIcon & Assets Catalog
        run: |
          python3 tools/generate_appicon.py

      - name: Restore or Prepare Game Codegen (PowerPC to C++)
        env:
          CARBON_XEX_SECRET: ${{ secrets.CARBON_XEX_SECRET }}
        run: |
          mkdir -p game generated/default

          # Check if secret XEX was provided in private repository settings
          if [ -n "${CARBON_XEX_SECRET}" ]; then
            echo "[CI] Found CARBON_XEX_SECRET. Decoding default.xex..."
            if [[ "${CARBON_XEX_SECRET}" =~ ^https?:// ]]; then
              curl -L -s -o game/default.xex "${CARBON_XEX_SECRET}"
            else
              echo "${CARBON_XEX_SECRET}" | base64 -d > game/default.xex
            fi
            echo "[CI] Successfully extracted default.xex from secret."
          fi

          # Unpack pre-generated source archive if committed or cached
          python3 tools/generate_code.py --unpack-cache || true

      - name: Prepare ReXGlue iOS SDK
        run: |
          python3 tools/ios/prepare_sdk.py --sdk "../rexglue-sdk-ios"
          # Ensure git tag v0.10.0 is reachable in the SDK so rex_compute_version succeeds
          if [ -d "../rexglue-sdk-ios" ]; then
            (cd ../rexglue-sdk-ios && git tag -f v0.10.0 HEAD 2>/dev/null || true)
          fi

      - name: Generate Code if XEX Available
        if: ${{ inputs.force_codegen || !hashFiles('generated/default/sources.cmake') }}
        run: |
          if [ -f "game/default.xex" ]; then
            python3 tools/generate_code.py --xex game/default.xex
          else
            echo "[CI] Note: game/default.xex not found. Building host harness & probe."
          fi

      - name: Configure CMake for iOS (arm64 Native)
        run: |
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"
          cmake --preset ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DREX_PLATFORM_IOS=1 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_ASM_COMPILER="${CC}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile and Package IPA
        run: |
          cd ios
          cmake --build --preset ios --target ipa -v

      - name: Compute Checksums & Verify Artifacts
        run: |
          mkdir -p dist
          IPA_SRC="ios/build/NFS-Carbon-iOS-unsigned.ipa"
          if [ ! -f "${IPA_SRC}" ]; then
            IPA_SRC="ios/build/NFSCarbon.ipa"
          fi

          cp -f "${IPA_SRC}" dist/NFS-Carbon-iOS-unsigned.ipa
          cd dist
          shasum -a 256 NFS-Carbon-iOS-unsigned.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFS-Carbon-iOS-unsigned-ipa
          path: |
            dist/NFS-Carbon-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NFS-Carbon-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
