# =============================================================================
#  Need for Speed: Carbon (Xbox 360, Title ID: 454107EC) - Codemagic CI/CD
#  Automated Native iOS/iPadOS Recompiled IPA Builder
# =============================================================================

workflows:
  ios-release:
    name: Build NFS Carbon iOS (ARM64 Unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        TITLE_ID: "454107EC"
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
        - $HOME/.nfsc-ios
        - $CM_BUILD_DIR/../rexglue-sdk-ios
    scripts:
      - name: Install build tools & Python packages
        script: |
          set -e
          echo "[Codemagic] Installing build tools..."
          brew install cmake ninja
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Generate AppIcon & Asset Catalog
        script: |
          set -e
          echo "[Codemagic] Generating high-contrast procedural AppIcon..."
          python3 tools/generate_appicon.py

      - name: Restore or Prepare Game Codegen (PowerPC to C++)
        script: |
          set -e
          echo "[Codemagic] Preparing USA XEX for codegen..."
          mkdir -p game generated/default xex

          # Stage xex/usa_default.xex (committed to private repo) into game/
          if [ -f "xex/usa_default.xex" ]; then
            echo "[Codemagic] Staging xex/usa_default.xex -> game/default.xex"
            cp -f xex/usa_default.xex game/default.xex
            echo "[Codemagic] Staged USA XEX: $(wc -c < game/default.xex) bytes"
          fi

          # Unpack pre-generated C++ source archive (352 translation files)
          python3 tools/generate_code.py --unpack-cache || true

      - name: Generate Code if XEX Available
        script: |
          set -e
          if [ -f "game/default.xex" ]; then
            echo "[Codemagic] Running USA XEX codegen..."
            python3 tools/generate_code.py --xex game/default.xex
            echo "[Codemagic] Verifying USA codegen (fail-fast)..."
            python3 tools/verify_usa_codegen.py
          else
            echo "[Codemagic] Note: game/default.xex not found. Skipping codegen."
          fi

      - name: Prepare ReXGlue iOS SDK & MoltenVK
        script: |
          set -e
          echo "[Codemagic] Preparing ReXGlue iOS SDK and applying Apple Silicon patches..."
          python3 tools/ios/prepare_sdk.py --sdk "$CM_BUILD_DIR/../rexglue-sdk-ios"
          # Ensure git tag v0.10.0 is reachable in the SDK so rex_compute_version succeeds
          if [ -d "$CM_BUILD_DIR/../rexglue-sdk-ios" ]; then
            cd "$CM_BUILD_DIR/../rexglue-sdk-ios"
            git tag -f v0.10.0 HEAD 2>/dev/null || true
            cd "$CM_BUILD_DIR"
          fi

      - name: Configure CMake for iOS (ARM64 Native)
        script: |
          set -e
          echo "[Codemagic] Configuring CMake with iOS preset..."
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"
          cmake --preset ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DREX_PLATFORM_IOS=1 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_ASM_COMPILER="${CC}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile and Package Unsigned IPA
        script: |
          set -e
          echo "[Codemagic] Compiling NFSCarbon.app and packaging IPA..."
          cd ios
          cmake --build --preset ios --target ipa -- -j 4 || {
            echo "[Codemagic] Build failed! Re-running failed file with single-job diagnostics..."
            cmake --build --preset ios --target ipa -v -- -j 1
            exit 1
          }

      - name: Compute Checksums & Export Artifacts
        script: |
          set -e
          echo "[Codemagic] Preparing release artifacts..."
          mkdir -p dist
          IPA_SRC="ios/build/NFS-Carbon-iOS-unsigned.ipa"
          if [ ! -f "${IPA_SRC}" ]; then
            IPA_SRC="ios/build/NFSCarbon.ipa"
          fi
          cp -f "${IPA_SRC}" dist/NFS-Carbon-iOS-unsigned.ipa
          cp -f "${IPA_SRC}" dist/NFSCarbon.ipa
          cd dist
          shasum -a 256 NFS-Carbon-iOS-unsigned.ipa > SHA256SUMS.txt
          echo "[Codemagic] SHA-256 Checksum:"
          cat SHA256SUMS.txt

    artifacts:
      - dist/NFS-Carbon-iOS-unsigned.ipa
      - dist/NFSCarbon.ipa
      - dist/SHA256SUMS.txt
      - ios/build/*.ipa

    publishing:
      email:
        recipients:
          - dev3lop3r2025@gmail.com
        notify:
          success: true
          failure: true
